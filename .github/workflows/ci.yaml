name: "ci"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Only the LFS files the tests read (tests/legacy/test_legacy_results_load.py);
      # the full LFS set is ~9 GB (spec §0.2, CR-7).
      - name: Fetch LFS files the tests read
        run: >-
          git lfs pull --include="experiments/archive/llm_bias/concept_pipeline/results/concept_pipeline_llm_bias_gpt-4.1_stage-0.json,experiments/archive/loan_approval/concept_pipeline/results/concept_pipeline_loan_approval_gpt-4.1_stage-0.json,experiments/archive/university_admission/concept_pipeline/results/concept_pipeline_university_admission_gpt-4.1_stage-0.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: check formatting
        run: uv run ruff format --check
      - name: check linting
        run: uv run ruff check
      - name: check types
        run: uv run pyright
      - name: run tests
        run: uv run pytest
      - name: build
        run: uv build
