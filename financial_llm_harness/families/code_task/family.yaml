provenance:
  drafted_by: {kind: llm, family: anthropic, id: claude-code-agent}
  approved_by: []
  approved_on: null
family_id: code_task
description: Coding-agent tasks (spec §T6); V1 holds K.M.1, slice S5 temporal_norm_code (§35).
contexts: [C7, C8]
faq_ids: [K.M.1, K.Q.1, K.Q.4, K.Q.7, K.M.2, K.M.3, K.M.4, K.M.7]
# Attach points the templates support (§T4.4): attach point → template slot that renders it.
battery_slots:
  preamble: preamble
  label:method_label: method_label
  code_comment: code_comment
scenario_schema:
  nodes:
    n_assets: {kind: primitive, type: numeric, precision: 0, display: int, relevant: true}
    n_dates: {kind: primitive, type: numeric, precision: 0, display: int, relevant: true}
    n_features: {kind: primitive, type: numeric, precision: 0, display: int, relevant: true}
    feature_names: {kind: primitive, type: categorical, display: text, depends_on: [n_features], relevant: true}
    burn_in: {kind: primitive, type: numeric, precision: 0, display: int, relevant: true}
    vendor_label: {kind: primitive, type: categorical, display: text}
    method_label: {kind: primitive, type: categorical, display: text}
    purpose: {kind: primitive, type: categorical, display: text, relevant: true}
interventions:
  I.Q.purpose:
    op: FRAMING_CHANGE
    node: purpose
    via: null
    form: set
    baseline: descriptive study of historical relationships
    counterfactual: signal for a walk-forward backtest
    delta: null
    relative_delta: null
    closure: {recompute: [], held_fixed: [], compensate: []}
    counterbalance: false
    concept_direction: 0
    concept_factor: null
    concept_lexicon: [look-ahead, future data, point-in-time, walk-forward, expanding, rolling, full sample]
response_contracts: [normalise_code_v1]
features:
  valid_point_in_time_normaliser: {type: binary, channel: decision, extractor: code_all, tests: [normalises_nontrivially, shape_and_index_valid, numeric_valid, leak_free]}
  normalises_nontrivially: {type: binary, channel: decision, extractor: code_outcome, test: normalises_nontrivially}
  shape_and_index_valid: {type: binary, channel: decision, extractor: code_outcome, test: shape_and_index_valid}
  numeric_valid: {type: binary, channel: decision, extractor: code_outcome, test: numeric_valid}
  leak_free: {type: binary, channel: decision, extractor: code_outcome, test: leak_free}
oracles:
  CT1:
    I.Q.purpose: {type: LEVEL, item_sign: null, basis: [B.identity], confidence: established}
# Correctness scorers (§32B.2 step 1a): a code item's checks are §T6.1 hidden tests. Twelve
# run the generic engines of family/hidden_tests.py; the four of K.M.1 (S5) are its
# fixture's tests. A task fixture supplies the data, tolerances and seeds (D-23).
scorers:
  HT.LEAK: {engine: fixture, note: §13.5 leakage oracle}
  HT.NONTRIV: {engine: fixture}
  HT.SHAPE: {engine: fixture}
  HT.FINITE: {engine: fixture}
  HT.ALIGN: {engine: ht_align}
  HT.PERM: {engine: ht_perm}
  HT.MONO: {engine: ht_mono}
  HT.REF: {engine: ht_ref}
  HT.PSD: {engine: ht_psd}
  HT.ANTI: {engine: ht_anti}
  HT.TRANS: {engine: ht_trans}
  HT.SURV: {engine: ht_surv}
  HT.PURGE: {engine: ht_purge}
  HT.ANNUAL: {engine: ht_annual}
  HT.COMPOUND: {engine: ht_compound}
  HT.NAN: {engine: ht_nan}
