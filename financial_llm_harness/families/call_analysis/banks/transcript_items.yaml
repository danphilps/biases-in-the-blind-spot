  and ten sentences per type with numeric slots {v1} and {v2}, filled from the state
  nodes v1_<type> and v2_<type>. The two lowest-ranked types are immaterial (the
  placebo swaps them). No sentence outside guidance_cut mentions guidance. Every
  guidance_cut sentence states a cause (weaker order intake) and the spec draws the cut at
  12–20%, so the item is the most material by its economics, not only by declaration.
