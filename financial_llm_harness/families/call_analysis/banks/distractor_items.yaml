description: >-
  Immaterial call items for the I.PRES.distractor cue (spec §T4.4, §35 S2): routine
  remarks about matters outside the case's twelve item types, with no figures and no
  mention of guidance or of any cut, reduction or lowering. Agent placeholders (D-14).
