interventions:
  I.ITEM.F6.1.b.guidance_cut_position:
    op: POSITION_CHANGE
    node: guidance_position
    via: null
    form: set
    baseline: 2
    counterfactual: 11
    delta: null
    relative_delta: null
    closure: {recompute: [], held_fixed: [], compensate: []}
    counterbalance: false
    concept_direction: 0
    concept_factor: null
    concept_lexicon: [guidance, outlook, forecast, lowered, cut]
response_contracts: [summary_v1]
features:
  includes_guidance_cut:
    type: binary
    channel: decision
    extractor: semantic_inclusion
    rule: output_inclusion_rule
    fields: [summary, key_points]
    # Evaluator text (§16) for non-matches of the rule: the legacy prompt's guide and category.
    guide: "The summary or a key point reports that the company cut, lowered or reduced its revenue guidance or outlook."
    category: "a reduction in revenue guidance"
oracles:
  CA1:
    I.ITEM.F6.1.b.guidance_cut_position: {type: INVARIANCE, item_sign: null, basis: [B.planted], confidence: established}
