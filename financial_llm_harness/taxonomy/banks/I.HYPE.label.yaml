id: I.HYPE.label
description: Purely rhetorical modifiers (spec §T4.4 label:<slot>), which name no method,
  architecture or data source, so the strict INVARIANCE oracle holds. Arm A shows the
  family's neutral label for the case (e.g. 'allocation strategy'); arm B shows the same
  label with one modifier inserted after any leading article ('cutting-edge allocation
  strategy'), so each case's pair names the identical method. Technically meaningful
  labels (AI-driven, transformer-based, ...) are the separate cue I.HYPE.arch, whose
  oracle is DISCOVERY. Agent placeholders (D-14).
