id: I.HYPE.label
description: Fashionable modifiers (spec §T4.4 label:<slot>). Arm A shows the family's
  neutral label for the case (e.g. 'allocation strategy'); arm B shows the same label
  with one modifier inserted after any leading article ('AI-driven allocation strategy'),
  so each case's pair names the identical method. Agent placeholders (D-14).
