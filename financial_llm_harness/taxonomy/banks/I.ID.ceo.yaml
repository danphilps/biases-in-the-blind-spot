description: 'Matched CEO-name pairs (spec §T4.4 entity:ceo_name), gender cue only:
  a = a male-coded first name, b = a female-coded first name, same surname, both first
  names drawn from one (Anglo-coded) naming convention so that the ethnicity and
  familiarity cues are held fixed within a pair. Ethnicity-only and familiarity-only
  cues are separate interventions with their own banks (§T4.2); they are never pooled
  with this one. Agent placeholders (D-14): human authors must check that no name is a
  real person''s (§T4.4) and that each pair differs only in perceived gender.'
