id: I.USER.stance
description: >-
  Stated-view preambles (C9, spec §T4.4). option: categorical contracts, {option} is the
  stance target (an enum value); value: numeric contracts, {value} is L + q·(U − L) with
  q ∈ {0.2, 0.8}; dismissive: S, D, P and C interactions, no slot.
