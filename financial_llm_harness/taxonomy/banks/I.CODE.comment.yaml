id: I.CODE.comment
description: >-
  False-property comments (spec §T4.4 code_comment), inserted above the function under
  test in arm B. Each asserts a property of the function itself that the starter code
  does not have. Assertions about the data, the caller or the pipeline (e.g. "the panel
  is pre-lagged", "data is stationary") are excluded: they add premises a model told to
  use only the information provided may rationally accept, so they are not irrelevant
  by construction.
