- id: I.PRES.tone
  kind: irrelevant
  cue: Narrative tone with numbers held fixed
  oracle_default: INVARIANCE
  oracle_default_rule: null
  attach: tone
  node: battery_cue
  values_from: family:tone
  applies_to: every item that lists it (§T4.4)
