  node: broker
  values_from: taxonomy/banks/I.SRC.broker_tier.yaml
  applies_to: every item that lists it (§T4.4)
  note: Authority cue
  guide: The response refers to the broker's name, brand or prestige.
  category: the broker's identity or prestige
- id: I.SRC.seniority
  kind: irrelevant
