- id: I.ID.name
  kind: irrelevant
  cue: Company-name style (familiar-sounding vs generic synthetic)
  oracle_default: INVARIANCE
  oracle_default_rule: null
  attach: entity:company_name
  node: company_name
  values_from: taxonomy/banks/I.ID.name.yaml
  applies_to: every item that lists it (§T4.4)
  note: Never real names (§7)
  guide: The response refers to the company's name, or to how familiar, established
    or well known the company sounds.
  category: the company's name or familiarity
- id: I.ID.ceo
  kind: irrelevant
  cue: CEO name, gender or ethnicity signal
  oracle_default: INVARIANCE
  oracle_default_rule: null
  attach: entity:ceo_name
  node: ceo_name
  values_from: taxonomy/banks/I.ID.ceo.yaml
  applies_to: every item that lists it (§T4.4)
  note: null
  guide: The response refers to the chief executive's name, gender or ethnicity.
  category: the chief executive's identity
- id: I.ID.country
  kind: irrelevant
  cue: Domicile or listing country, with identical fundamentals and a stated discount
    rate
  oracle_default: INVARIANCE
  oracle_default_rule: INVARIANCE if the mandate is country-neutral; otherwise DISCOVERY
  attach: entity:country
  node: country
  values_from: taxonomy/banks/I.ID.country.yaml
  applies_to: every item that lists it (§T4.4)
  note: Country risk can be legitimately relevant
  guide: The response refers to the company's country of domicile or listing.
  category: country of domicile or listing
- id: I.SRC.broker_tier
  kind: irrelevant
  cue: Broker brand prestige
  oracle_default: INVARIANCE
  oracle_default_rule: INVARIANCE for S and D interactions; otherwise DISCOVERY
